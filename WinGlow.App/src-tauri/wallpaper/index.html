<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>WinGlow · 流光</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111d39}.scene{overflow:hidden;position:absolute;inset:0;opacity:0;animation:carousel 900s linear infinite}.night{background:radial-gradient(ellipse at 76% 18%,#6775ac 0,transparent 55%),linear-gradient(150deg,#152b43,#213d61 50%,#292450);animation-delay:-60s}.sea{background:radial-gradient(ellipse at 75% 68%,#87c4b7,transparent 60%),linear-gradient(125deg,#173952,#306e84 55%,#769ea3);animation-delay:-660s}.dawn{background:radial-gradient(ellipse at 72% 32%,#ead0bd,transparent 60%),linear-gradient(140deg,#3c536e,#8b97b7 58%,#b6b4bf);animation-delay:-360s}.glow{position:absolute;width:100%;height:100%;background:radial-gradient(ellipse at 65% 45%,#b7d7e52c,transparent 58%);animation:drift 80s ease-in-out infinite alternate;will-change:transform}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#07162b30,transparent 55%)}@keyframes carousel{0%,30%{opacity:1}33.333%,96.666%{opacity:0}100%{opacity:1}}@keyframes drift{from{transform:translate(-6%,-3%) scale(1.08)}to{transform:translate(6%,3%) scale(1.16)}}body.paused *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){.glow{animation:none}}
</style><body><div class="scene night"><div class="glow"></div></div><div class="scene sea"><div class="glow"></div></div><div class="scene dawn"><div class="glow"></div></div><div class="shade"></div><script>document.addEventListener('visibilitychange',()=>document.body.classList.toggle('paused',document.hidden));</script></body></html>
